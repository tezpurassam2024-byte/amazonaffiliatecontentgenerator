[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Map /api/* to netlify functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA routing redirect for client-side React routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
